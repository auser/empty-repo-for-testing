# Full user-scoped Pire configuration.
#
# Platform location is shown by:
#   pire config paths
#
# Credentials are environment-variable names, never literal secrets.

[[models]]
id = "offline"
kind = "offline"
provider_name = "offline"
model = "offline"
enabled = true
local = true
priority = -100
tags = ["general", "testing"]
input_cost_per_million = 0.0
output_cost_per_million = 0.0
context_window = 128000
timeout_secs = 120
max_response_bytes = 8388608

[models.capabilities]
tools = true
parallel_tools = false
vision = false
structured_output = false
reasoning = false
streaming = false

