[package]
name = "pire"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
publish = false

[dependencies]
asupersync = { version = "0.4.4", default-features = false, features = [
    "tls-webpki-roots",
] }
clap = { version = "4.6.6", features = ["derive", "env", "string"] }
config = { version = "0.15.25", features = ["toml"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_with = { version = "3", features = ["macros"] }
thiserror = "2.0.20"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }

[target.'cfg(windows)'.dependencies]
enable-ansi-support = "0.3.1"

[dev-dependencies]
tempfile = "3.27.0"

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[profile.release]
lto = "thin"
overflow-checks = true
strip = "symbols"
