[workspace]
members = [
    "crates/pire-core",
    "crates/pire-builtins",
    "crates/pire-cli",
]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT OR Apache-2.0"
repository = "https://github.com/auser/pire"

[workspace.dependencies]
clap = { version = "4.6.6", features = ["derive", "env", "string"] }
config = { version = "0.15.25", default-features = false, features = ["toml"] }
crossterm = "0.29"
directories = "6.0.0"
hex = "0.4.3"
reqwest = { version = "0.12.28", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_with = { version = "3.22.0", features = ["macros"] }
sha2 = "0.10.9"
shlex = "1.3.0"
thiserror = "2.0.20"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
wait-timeout = "0.2.1"
walkdir = "2.5.0"

pire-core = { path = "crates/pire-core" }
pire-builtins = { path = "crates/pire-builtins" }

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
