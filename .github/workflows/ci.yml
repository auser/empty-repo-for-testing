name: Pire full verification

on:
  push:
    branches:
      - chatgpt/pire-pi-router-partial
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy

      - name: Remove compiler scratch payloads
        shell: python
        run: |
          import pathlib
          import shutil
          shutil.rmtree(pathlib.Path("ci"), ignore_errors=True)

      - name: Generate lockfile
        run: cargo generate-lockfile

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check
        run: cargo check --locked --workspace --all-targets

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked --workspace --all-targets

      - name: Build optimized binary
        run: cargo build --locked --release -p pire-cli

      - name: Verify optimized binary size
        shell: python
        run: |
          import pathlib
          import sys

          binary = pathlib.Path("target/release/pire.exe" if sys.platform == "win32" else "target/release/pire")
          size = binary.stat().st_size
          print(f"optimized_binary_bytes={size}")
          if sys.platform.startswith("linux") and size > 20 * 1024 * 1024:
              raise SystemExit(f"optimized binary exceeds 20 MiB budget: {size}")

      - name: Package compiler-verified source
        if: success() && matrix.os == 'ubuntu-latest'
        shell: python
        run: |
          import pathlib
          import tarfile

          root = pathlib.Path('.')
          output = pathlib.Path('pire-full-verified.tar.gz')

          def include(member: tarfile.TarInfo):
              parts = pathlib.PurePosixPath(member.name).parts
              if 'target' in parts or '.git' in parts or 'ci' in parts:
                  return None
              member.uid = 0
              member.gid = 0
              member.uname = ''
              member.gname = ''
              return member

          with tarfile.open(output, 'w:gz') as archive:
              for path in sorted(root.iterdir()):
                  if path.name in {'.git', 'target', 'ci', output.name}:
                      continue
                  archive.add(path, arcname=f'pire/{path.name}', filter=include)

      - uses: actions/upload-artifact@v4
        if: success() && matrix.os == 'ubuntu-latest'
        with:
          name: pire-full-verified
          path: pire-full-verified.tar.gz
