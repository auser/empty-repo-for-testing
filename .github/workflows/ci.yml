name: CI

on:
  push:
    branches:
      - chatgpt/pire-full-product-v3
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy
      - name: Generate lockfile
        run: cargo generate-lockfile
      - uses: Swatinem/rust-cache@v2
      - name: Format source
        run: cargo fmt --all
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check
        run: cargo check --locked --workspace --all-targets
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked --workspace --all-targets
      - name: Package verified source
        if: success() && matrix.os == 'ubuntu-latest'
        shell: python
        run: |
          import pathlib
          import tarfile

          root = pathlib.Path('.')
          output = pathlib.Path('pire-full-product-verified.tar.gz')

          def include(member: tarfile.TarInfo):
              parts = pathlib.PurePosixPath(member.name).parts
              if 'target' in parts or '.git' in parts:
                  return None
              return member

          with tarfile.open(output, 'w:gz') as archive:
              for path in sorted(root.iterdir()):
                  if path.name in {'.git', 'target', output.name}:
                      continue
                  archive.add(path, arcname=f'pire/{path.name}', filter=include)
      - uses: actions/upload-artifact@v4
        if: success() && matrix.os == 'ubuntu-latest'
        with:
          name: pire-full-product-verified
          path: pire-full-product-verified.tar.gz
