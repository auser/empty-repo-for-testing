name: Pire plugin-first v0.2 source verification

on:
  push:
    branches:
      - chatgpt/pire-plugin-first-v02
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: pire
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: pire

      - name: Verify lockfile is current
        run: cargo check --locked --workspace --all-targets

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked --workspace --all-targets

      - name: Build optimized binary
        run: cargo build --locked --release -p pire-cli

      - name: Enforce optimized binary size budget
        shell: python
        working-directory: .
        run: |
          import pathlib
          import platform

          executable = pathlib.Path("pire/target/release/pire.exe" if platform.system() == "Windows" else "pire/target/release/pire")
          size = executable.stat().st_size
          maximum = 25 * 1024 * 1024
          print(f"{executable}: {size} bytes ({size / 1024 / 1024:.2f} MiB)")
          if size > maximum:
              raise SystemExit(f"release binary exceeds {maximum} byte budget")
          pathlib.Path(f"binary-size-{platform.system()}.txt").write_text(
              f"path={executable}\nbytes={size}\nmib={size / 1024 / 1024:.2f}\nbudget_bytes={maximum}\n",
              encoding="utf-8",
          )

      - name: Smoke test
        shell: python
        working-directory: .
        run: |
          import pathlib
          import platform
          import subprocess
          import tempfile

          executable = pathlib.Path("pire/target/release/pire.exe" if platform.system() == "Windows" else "pire/target/release/pire")
          workspace = pathlib.Path(tempfile.mkdtemp(prefix="pire-smoke-"))
          commands = [
              [str(executable), "--version"],
              [str(executable), "--workspace", str(workspace), "doctor"],
              [str(executable), "--workspace", str(workspace), "plugins"],
              [str(executable), "--workspace", str(workspace), "--no-session", "--print", "hello"],
          ]
          for command in commands:
              print("$", " ".join(command))
              completed = subprocess.run(command, capture_output=True, text=True, timeout=30, check=False)
              print(completed.stdout)
              print(completed.stderr)
              if completed.returncode != 0:
                  raise SystemExit(completed.returncode)

      - name: Package exact compiler-verified source
        if: success() && matrix.os == 'ubuntu-latest'
        shell: python
        working-directory: .
        run: |
          import hashlib
          import pathlib
          import shutil
          import tarfile

          source = pathlib.Path("pire")
          staging = pathlib.Path("package/pire")
          shutil.rmtree(staging.parent, ignore_errors=True)
          staging.parent.mkdir(parents=True)

          def ignore(directory, names):
              return {name for name in names if name in {"target", ".git"}}

          shutil.copytree(source, staging, ignore=ignore)
          linux_size = pathlib.Path("binary-size-Linux.txt").read_text(encoding="utf-8")
          (staging / "VERIFICATION.txt").write_text(
              "Pire plugin-first v0.2 compiler verification\n"
              "Rust: 1.97.1\n"
              "Platforms: Ubuntu, macOS, Windows\n"
              "Gates: locked check, fmt, clippy -D warnings, tests, release build, smoke tests\n\n"
              + linux_size,
              encoding="utf-8",
          )

          archive = pathlib.Path("pire-plugin-first-v02-source-verified.tar.gz")
          with tarfile.open(archive, "w:gz") as bundle:
              bundle.add(staging, arcname="pire")
          digest = hashlib.sha256(archive.read_bytes()).hexdigest()
          pathlib.Path(f"{archive}.sha256").write_text(
              f"{digest}  {archive.name}\n",
              encoding="utf-8",
          )
          print(f"SHA-256: {digest}")

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: pire-plugin-first-v02-source-${{ runner.os }}
          if-no-files-found: error
          path: |
            binary-size-${{ runner.os }}.txt
            pire-plugin-first-v02-source-verified.tar.gz
            pire-plugin-first-v02-source-verified.tar.gz.sha256
