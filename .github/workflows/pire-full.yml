name: Pire full compiler verification

on:
  push:
    branches:
      - chatgpt/pire-full-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy

      - name: Reconstruct and validate source archive
        shell: python
        run: |
          import base64
          import hashlib
          import io
          import pathlib
          import shutil
          import tarfile

          root = pathlib.Path.cwd()
          expected_chunks = {
              "chunk-000": "a28261c81d144b0460173e086186a02d3a0e5a6cd2b91bab08970dfcd337f507",
              "chunk-001": "17c7b1cf3bca70d10a2ee0a56c8c083b82257654b3b670ca68c1c3d32f816cb9",
              "chunk-002": "857f6434ae6b77970a4fd93b34fd5a5bb2d9d8c7b4fc0aed6cc16a489f91b8ba",
              "chunk-003": "7939f9954def8bb5f0afd6a9f718944225b4145248dd43dffc1994c9564fd8b6",
              "chunk-004": "fab9bc3e041f96e1be7202548456419bb191ad4241b13a799c30988d6518c4bb",
              "chunk-005": "996811ee584ceabdfcbbe31e60462ae2e7dd48ef3ff75c0ff282a17265002990",
              "chunk-006": "ae9667038aa7bcf04197161569b499e9bcc1afa51679012062aadc1d88771a92",
              "chunk-007": "d0adcc32af2c28ae0fdaa7f59ae3dfc1a9f883772856850708a027f337279319",
          }

          chunks = sorted((root / "ci").glob("chunk-*"))
          if len(chunks) != len(expected_chunks):
              raise SystemExit(
                  f"expected {len(expected_chunks)} archive chunks, found {len(chunks)}"
              )

          for path in chunks:
              data = path.read_bytes()
              digest = hashlib.sha256(data).hexdigest()
              expected = expected_chunks.get(path.name)
              print(f"{path.name}: bytes={len(data)} sha256={digest}")
              if expected is None:
                  raise SystemExit(f"unexpected archive chunk: {path.name}")
              if digest != expected:
                  raise SystemExit(
                      f"chunk hash mismatch for {path.name}: expected {expected}, got {digest}"
                  )

          encoded = b"".join(path.read_bytes() for path in chunks)
          archive = base64.b64decode(encoded, validate=True)
          digest = hashlib.sha256(archive).hexdigest()
          expected = "fded1feaebfafdcd7ca0d8712b61c074264a3ce1cd2ccd20d01cdb650ff0d26e"
          if digest != expected:
              raise SystemExit(f"archive SHA-256 mismatch: expected {expected}, got {digest}")

          work = root / "work"
          shutil.rmtree(work, ignore_errors=True)
          work.mkdir()

          with tarfile.open(fileobj=io.BytesIO(archive), mode="r:gz") as source:
              root_resolved = work.resolve()
              for member in source.getmembers():
                  target = (work / member.name).resolve()
                  if root_resolved not in target.parents and target != root_resolved:
                      raise SystemExit(f"unsafe archive path: {member.name}")
                  if member.issym() or member.islnk():
                      raise SystemExit(f"archive links are not permitted: {member.name}")
              source.extractall(work)

      - name: Toolchain
        working-directory: work
        run: rustc --version --verbose

      - name: Generate lockfile
        working-directory: work
        run: cargo generate-lockfile

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: work

      - name: Format
        working-directory: work
        run: cargo fmt --all -- --check

      - name: Check
        working-directory: work
        run: cargo check --locked --all-targets

      - name: Clippy
        working-directory: work
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test
        working-directory: work
        run: cargo test --locked --all-targets

      - name: CLI smoke tests
        working-directory: work
        shell: bash
        run: |
          set -euo pipefail
          cargo run --locked -- --version
          cargo run --locked -- doctor
          cargo run --locked -- --provider echo --print "verification prompt"
          cargo run --locked -- models list

      - name: Upload exact verified source
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: pire-full-verified-source
          include-hidden-files: true
          if-no-files-found: error
          path: work
