name: Pire compiler verification

on:
  push:
    branches:
      - chatgpt/pire-compile-fix
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: work

      - name: Extract Pire source
        shell: python
        run: |
          import base64
          import io
          import pathlib
          import shutil
          import tarfile

          work = pathlib.Path("work")
          shutil.rmtree(work, ignore_errors=True)
          work.mkdir()
          encoded = pathlib.Path("ci/pire-ci-input.tar.gz.b64").read_bytes()
          archive = io.BytesIO(base64.b64decode(encoded))
          with tarfile.open(fileobj=archive, mode="r:gz") as source:
              source.extractall(work)

      - name: Toolchain
        working-directory: work
        run: rustc --version --verbose

      - name: Format
        working-directory: work
        run: cargo fmt --all -- --check

      - name: Check
        working-directory: work
        run: cargo check --locked --all-targets

      - name: Clippy
        working-directory: work
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test
        working-directory: work
        run: cargo test --locked --all-targets

      - name: Upload verification output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pire-verification-${{ runner.os }}
          if-no-files-found: warn
          path: work/Cargo.lock
